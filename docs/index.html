    <!-- Open Graph: Facebook, WhatsApp, Discord, LinkedIn, Signal, Slack.
         width/height matter more than they look: without them WhatsApp and
         Facebook must fetch and measure the image before they can lay the
         card out, which is why a first share so often renders as bare text. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Friends of Duty" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Friends of Duty — a 2003 LAN shooter, rebuilt as a sandbox" />

    <meta property="og:image" content="https://friendsofduty.com/media/og-card-v2.jpg" />
    <meta property="og:image:secure_url" content="https://friendsofduty.com/media/og-card-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Friends of Duty logo over a bombed-out European street at dusk." />
