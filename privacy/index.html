<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy policy — Friends of Duty</title>
    <meta
      name="description"
      content="Friends of Duty collects nothing about you — no cookies, no analytics, no telemetry, no third-party requests. Here is exactly what that means, in detail."
    />
    <meta name="theme-color" content="#080b0d" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://friendsofduty.com/privacy/" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/media/icon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph: Facebook, WhatsApp, Discord, LinkedIn, Signal, Slack.
         width/height matter more than they look: without them WhatsApp and
         Facebook must fetch and measure the image before they can lay the
         card out, which is why a first share so often renders as bare text. -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Friends of Duty" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Privacy policy — Friends of Duty" />
    <meta property="og:description" content="No cookies, no analytics, no telemetry, no third-party requests. Here is exactly what that means, in detail." />
    <meta property="og:url" content="https://friendsofduty.com/privacy/" />
    <meta property="og:image" content="https://friendsofduty.com/media/og-card-v2.jpg" />
    <meta property="og:image:secure_url" content="https://friendsofduty.com/media/og-card-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Friends of Duty logo over a bombed-out European street at dusk." />

    <!-- Twitter/X reads its own namespace and ignores most og:* fields. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy policy — Friends of Duty" />
    <meta name="twitter:description" content="No cookies, no analytics, no telemetry, no third-party requests." />
    <meta name="twitter:image" content="https://friendsofduty.com/media/og-card-v2.jpg" />
    <meta name="twitter:image:alt" content="The Friends of Duty logo over a bombed-out European street at dusk." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/privacy.tsx"></script>
  </body>
</html>
